[tool.ruff]
target-version = "py39"
line-length = 100
exclude = ["reports", "htmlcov"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
branch = true
source = ["checker", "main"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.coverage.html]
directory = "reports/coverage"

